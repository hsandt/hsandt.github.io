{% assign entry = include.item %}
<li>
  <a rel="me" href="{{ entry.url }}" target="_blank" title="{{ entry.title | default: entry.platform }}">
    {% comment %} fa-2x: show icons bigger than header & footer social media {% endcomment %}
    <span class="fa-brands fa-{{ entry.platform }} fa-2x"></span>
  </a>
</li>
